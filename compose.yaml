services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testkit
      POSTGRES_PASSWORD: testkit
      POSTGRES_DB: testkit
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testkit -d testkit"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Disposable by design: no host directories or persistent volumes.
    tmpfs:
      - /var/lib/postgresql/data
